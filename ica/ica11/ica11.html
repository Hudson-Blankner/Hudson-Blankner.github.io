<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ica11.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
</head>
<body>
    <header class="site-header">
    <div class="container header-inner">
      <p class="site-brand">Random Story Generator</p>
    </div>
    </header>
    <main class="container">
        <h1 class="page-title">Random Story Generator</h1>

        <section class="card">
            <div class="about-box">
                <div>
                    <h2 class="section-title">Customize Story</h2>

                    <div class="form-group">
                        <label for="custom-name">Enter custom name:</label>
                        <input id="custom-name" type="text">
                    </div>
                    <fieldset class="locale-box">
                        <legend>Choose locale:</legend>

                        <label>
                            <input id="us" type="radio" name="uk-us" value="us" checked>US
                        </label>
                        <label>
                            <input id="uk" type="radio" name="uk-us" value="uk">UK
                        </label>
                    </fieldset>
                    <button class="generate-btn generate">Generate random story</button>
                    <p class="story"></p>
                </div>
            </div>
        </section>
    </main>
<script>
    // Complete variable definitions and random functions

    const customName = document.getElementById("custom-name");
    const generateBtn = document.querySelector(".generate");
    const story = document.querySelector(".story");

    function randomValueFromArray(array) {
    const random = Math.floor(Math.random() * array.length);
    return array[random];
    }

    // Raw text strings
    characters = ["a stressed college student", "a mysterious traveler", "a late-night coder"]
    
    places = ["the CU Boulder campus", "a quiet coffee shop", "an empty hiking trail"]

    events = [
        "paused because something felt off",
        "realized they were going the wrong way",
        "made eye contact with someone and looked away",
        "checked their phone like they had somewhere to be",
        "almost tripped but recovered quickly",
        "stopped walking for no clear reason"
    ];
    // Partial return random string function

    function returnRandomStoryString() {
        let randomCharacter = randomValueFromArray(characters);
        let randomPlaces = randomValueFromArray(places);
        let randomEvent = randomValueFromArray(events);
        storyText = `It was 94 Fahrenheit outside, so ${randomCharacter} decided to go out for a bit. On the way to ${randomPlaces}, they ${randomEvent}. Nearby, ${randomValueFromArray(characters)} was also there and ${randomValueFromArray(events)}. Neither of them really said anything. Bob saw the whole thing and just kept watching. A little later, everyone ended up at ${randomValueFromArray(places)}, where ${randomCharacter} ${randomValueFromArray(events)} again. Bob was not surprised — ${randomCharacter} weighs 300 pounds, and it was a long day.`;
        
        return storyText;
    }

    // Event listener and partial generate function definition

    generateBtn.addEventListener("click", generateStory);

    function generateStory() {
        let newStory = returnRandomStoryString()
    if (customName.value !== "") {
        const name = customName.value;
        newStory = newStory.replace("Bob", name);
    }

    if (document.getElementById("uk").checked) {
        const weight = `${Math.round(300 / 14)} stone`;
        const temperature = `${Math.round((94 - 32) * (5 / 9))} Celsius`;
        newStory = newStory.replace("300 pounds", weight);
        newStory = newStory.replace("94 Fahrenheit", temperature);
    }

    // TODO: replace "" with the correct expression
    story.textContent = newStory;
    story.style.visibility = "visible";
    }
</script>
</body>
</html>
